name: Integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bind9-and-sqlite:
    name: BIND 9 and SQLite integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated authoritative DNS
        run: sudo apt-get update && sudo apt-get install -y bind9 apparmor-utils\n      - name: Permit ephemeral BIND configuration on disposable CI runner\n        run: sudo aa-complain /usr/sbin/named
      - name: Install package
        run: python -m pip install -e .
      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
