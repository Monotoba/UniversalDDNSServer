name: Integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bind9-and-sqlite:
    name: BIND 9 and SQLite integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Monotoba/UDDNSUpdater
          ref: e15a350be0d5b59ea116c1a96444884df6f70c8f
          path: updater
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated authoritative DNS
        run: sudo apt-get update && sudo apt-get install -y bind9
      - name: Isolate BIND binary from host AppArmor profile
        run: sudo install -m 755 /usr/sbin/named /usr/local/bin/ddns-ci-named
      - name: Install package
        run: python -m pip install -e '.[api,dev]' requests
      - name: Validate deployment scripts and simulated recovery
        run: |
          sh -n deploy/smoke-check.sh deploy/validate-install.sh
          bash -n tests/deployment/create-vm.sh tests/deployment/vm-test.sh tests/deployment/check-offline-restore.sh tests/deployment/restrict-vm-tsig.sh tests/deployment/update-vm.sh
          python -m py_compile tests/deployment/check-restore.py tests/deployment/check-recovery.py tests/deployment/check-inflight.py tests/deployment/check-tsig-deny.py
          python tests/deployment/check-inflight.py
      - name: Validate systemd unit syntax
        run: |
          systemd-analyze verify deploy/universalddns-api.service deploy/universalddns-worker.service 2>&1 | tee /tmp/universalddns-unit-check.log
          ! grep -E '(Unknown key|Failed to parse|Missing .*=|Invalid argument)' /tmp/universalddns-unit-check.log
      - name: Run integration tests
        env:
          DDNS_NAMED_BIN: /usr/local/bin/ddns-ci-named
          UDDNS_UPDATER_SOURCE: ${{ github.workspace }}/updater
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

  release-packaging:
    name: Build pre-alpha wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and inspect package metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile, tomllib
          from email.parser import Parser
          with open('pyproject.toml', 'rb') as fp:
              version = tomllib.load(fp)['project']['version']
          wheel = glob.glob('dist/*.whl')
          sdist = glob.glob('dist/*.tar.gz')
          assert len(wheel) == len(sdist) == 1
          assert f'universalddnsserver-{version}-' in wheel[0]
          assert f'universalddnsserver-{version}.tar.gz' in sdist[0]
          with zipfile.ZipFile(wheel[0]) as z:
              names = z.namelist()
              metadata_files = [x for x in names if x.endswith('.dist-info/METADATA')]
              assert len(metadata_files) == 1
              metadata = Parser().parsestr(z.read(metadata_files[0]).decode('utf-8'))
              assert metadata['Name'].lower() == 'universalddnsserver'
              assert metadata['Version'] == version
              assert any(x.startswith('universalddns/') for x in names)
          with tarfile.open(sdist[0]) as t:
              names = t.getnames()
              assert any(x.endswith('/pyproject.toml') for x in names)
              assert any(x.endswith('/README.md') for x in names)
          print(f'PASS: wheel and sdist version {version}, metadata and contents')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: universalddnsserver-candidate
          path: dist/*
          if-no-files-found: error
