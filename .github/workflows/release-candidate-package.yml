name: Release candidate package validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate version, included files and archive safety
        run: |
          python - <<'PY'
          import importlib.metadata
          import pathlib
          import tarfile
          import tomllib
          import zipfile
          from email.parser import Parser

          root = pathlib.Path("dist")
          wheel, = root.glob("*.whl")
          sdist, = root.glob("*.tar.gz")
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          assert version in wheel.name and version in sdist.name
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata, = (name for name in names if name.endswith(".dist-info/METADATA"))
              doc = Parser().parsestr(archive.read(metadata).decode())
              assert doc["Version"] == version
              assert doc["Name"].lower() == "universalddnsserver"
              assert "universalddns/runtime.py" in names
              assert "universalddns/admin.py" in names
          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/LICENSE") for name in names)
              assert any(name.endswith("/README.md") for name in names)
          for name in [*names, *zipfile.ZipFile(wheel).namelist()]:
              lowered = name.lower()
              assert not any(part in lowered for part in (
                  "tsig.json", "state.sqlite3", ".env", "private.key",
                  "uddns-vm-token", "/.git/", "/.venv/")), name
          print("PASS: candidate metadata and archive contents")
          PY
      - name: SHA-256 digest evidence (not a published release)
        run: cd dist && sha256sum *.whl *.tar.gz
