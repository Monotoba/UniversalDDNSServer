name: Unit and documentation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: timeout --signal=TERM --kill-after=5s 180s python -u -m unittest discover -s tests -v
      - name: Cross-UID snapshot handoff (privileged isolated fixture)
        if: matrix.python-version == '3.12'
        run: timeout --signal=TERM --kill-after=5s 30s sudo -E "$(command -v python)" -u -m unittest discover -s tests -p test_snapshot_cross_uid.py -v
