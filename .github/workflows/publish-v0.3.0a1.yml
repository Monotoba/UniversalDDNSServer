name: Publish approved v0.3.0a1 alpha
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.3.0a1.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the verified CI distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 38663410569 --repo Monotoba/UniversalDDNSServer --name universalddnsserver-candidate --dir release-assets
      - name: Verify candidate artifact checksums
        run: |
          cd release-assets
          printf '%s\n' \
            'e13d2d5eaf763335bd1f833538e538fb62926490f6507910a806aa6c2a6c747f  universalddnsserver-0.3.0a1-py3-none-any.whl' \
            '67bfcacffefa0687f9db3fd25dae90e86a5515b4875a5b589b3eab316947628b  universalddnsserver-0.3.0a1.tar.gz' > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish owner-approved prerelease from tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0a1 \
            --repo Monotoba/UniversalDDNSServer \
            --target de496a7190be72a326d30f330ab0a4cc1156cb92 \
            --title "UniversalDDNSServer v0.3.0a1 (Alpha)" \
            --prerelease \
            --notes-file docs/releases/v0.3.0a1.md \
            release-assets/universalddnsserver-0.3.0a1-py3-none-any.whl \
            release-assets/universalddnsserver-0.3.0a1.tar.gz \
            release-assets/SHA256SUMS
