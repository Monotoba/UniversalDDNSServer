[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universalddnsserver"
version = "0.0.1"
description = "Modular self-hosted DDNS management core (pre-alpha)"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "R. Morgan"}]

[tool.setuptools.packages.find]
where = ["src"]
