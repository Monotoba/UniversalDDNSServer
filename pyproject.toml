[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universalddnsserver"
version = "0.3.0a1"
description = "Modular self-hosted DDNS management core (pre-alpha)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.6,<3"]
license = {file = "LICENSE"}
authors = [{name = "R. Morgan"}]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["ruff>=0.9,<1", "mypy>=1.15,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/universalddns/domain.py", "src/universalddns/ports.py"]
show_error_codes = true
warn_unused_ignores = true
